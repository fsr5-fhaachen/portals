- name: install php and extensions
  become: yes
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - php{{ php_version }}-cli
    - php{{ php_version }}-common
    - php{{ php_version }}-curl
    - php{{ php_version }}-bcmath
    - php{{ php_version }}-mysql
    - php{{ php_version }}-pgsql
    - php{{ php_version }}-simplexml
    - php{{ php_version }}-redis
    - php{{ php_version }}-dom
    - php{{ php_version }}-zip
    - php{{ php_version }}-mbstring
    - php-pear
    - php{{ php_version }}-dev
- name: check if composer is installed
  ansible.builtin.stat:
    path: /usr/local/bin/composer
  register: composer_binary
- name: download composer installer
  ansible.builtin.get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-setup.php
    mode: "0644"
  when: not composer_binary.stat.exists
- name: verify composer installer
  ansible.builtin.shell: |
    EXPECTED_HASH="ed0feb545ba87161262f2d45a633e34f591ebb3381f2e0063c345ebea4d228dd0043083717770234ec00c5a9f9593792"
    ACTUAL_HASH=$(php -r "echo hash_file('sha384', '/tmp/composer-setup.php');")
    if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
      echo "Installer corrupt"
      rm /tmp/composer-setup.php
      exit 1
    fi
    echo "Installer verified"
  args:
    executable: /bin/bash
  when: not composer_binary.stat.exists
- name: install composer
  ansible.builtin.shell: |
    php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
  args:
    creates: /usr/local/bin/composer
- name: remove composer installer
  ansible.builtin.file:
    path: /tmp/composer-setup.php
    state: absent
  when: not composer_binary.stat.exists
- name: install swoole packages
  become: yes
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - php{{ php_version }}-dev
    - libpq-dev
    - libcurl4-openssl-dev
    - libssl-dev
    - zlib1g-dev
    - libpq-dev
    - unixodbc-dev
    - libaio-dev
    - libsqlite3-dev
    - libssl-dev
    - libcurl4-openssl-dev
    - libc-ares-dev
    - libbrotli-dev
    - libzstd-dev
    - liburing-dev
    - g++
    - make
- name: check if swoole is installed
  ansible.builtin.shell: pecl list | grep -i swoole
  register: swoole_installed
  ignore_errors: true
- name: install swoole
  ansible.builtin.shell: |
    yes '' | pecl install swoole
  args:
    executable: /bin/bash
  environment:
    PHP_PEAR_PHP_BIN: /usr/bin/php
  when: swoole_installed.rc != 0
- name: enable swoole extension
  ansible.builtin.copy:
    dest: /etc/php/{{ php_version }}/cli/conf.d/20-swoole.ini
    content: |
      ; configuration for php swoole module
      ; priority=20
      extension=swoole.so
    mode: "0644"
